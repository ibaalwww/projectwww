name: Build 3105 (unsigned IPA)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Find Xcode project/workspace
        id: project
        shell: bash
        run: |
          set -euo pipefail
          workspace=$(find . -maxdepth 5 -name '*.xcworkspace' -print -quit)
          project=$(find . -maxdepth 5 -name '*.xcodeproj' -print -quit)
          if [[ -n "$workspace" ]]; then
            echo "kind=workspace" >> "$GITHUB_OUTPUT"
            echo "path=$workspace" >> "$GITHUB_OUTPUT"
          elif [[ -n "$project" ]]; then
            echo "kind=project" >> "$GITHUB_OUTPUT"
            echo "path=$project" >> "$GITHUB_OUTPUT"
          else
            echo 'No .xcodeproj or .xcworkspace found.'
            exit 1
          fi

      - name: Detect scheme
        id: scheme
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.project.outputs.kind }}" == "workspace" ]]; then
            list=$(xcodebuild -workspace "${{ steps.project.outputs.path }}" -list)
          else
            list=$(xcodebuild -project "${{ steps.project.outputs.path }}" -list)
          fi
          scheme=$(printf '%s\n' "$list" | awk '/Schemes:/{f=1;next} f && NF{gsub(/^[[:space:]]+|[[:space:]]+$/, ""); print; exit}')
          if [[ -z "$scheme" ]]; then
            echo 'Could not detect an Xcode scheme.'
            exit 1
          fi
          echo "name=$scheme" >> "$GITHUB_OUTPUT"
          echo "Building scheme: $scheme"

      - name: Build unsigned archive
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build
          args=(
            -scheme "${{ steps.scheme.outputs.name }}"
            -configuration Release
            -sdk iphoneos
            -destination 'generic/platform=iOS'
            -archivePath "$PWD/build/3105.xcarchive"
            CODE_SIGNING_ALLOWED=NO
            CODE_SIGNING_REQUIRED=NO
          )
          if [[ "${{ steps.project.outputs.kind }}" == "workspace" ]]; then
            xcodebuild -workspace "${{ steps.project.outputs.path }}" "${args[@]}" archive
          else
            xcodebuild -project "${{ steps.project.outputs.path }}" "${args[@]}" archive
          fi

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          app=$(find build/3105.xcarchive/Products/Applications -maxdepth 1 -name '*.app' -print -quit)
          test -n "$app"
          rm -rf build/Payload build/3105-unsigned.ipa
          mkdir -p build/Payload
          cp -R "$app" build/Payload/
          ditto -c -k --sequesterRsrc --keepParent build/Payload build/3105-unsigned.zip
          mv build/3105-unsigned.zip build/3105-unsigned.ipa

      - name: Upload IPA and archive
        uses: actions/upload-artifact@v4
        with:
          name: 3105-unsigned-build-${{ github.sha }}
          path: |
            build/3105-unsigned.ipa
            build/3105.xcarchive
          if-no-files-found: error
